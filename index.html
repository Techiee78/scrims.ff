<html lang="en">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="manifest" href="/manifest.json" />
    <title>Scrims.ff — Free Fire Tournaments</title>
    <meta
      name="description"
      content="Join daily Free Fire tournaments on Scrims.ff — Full Map and Clash Squad rooms, instant slot booking, coin entry and cash prizes."
    />
    <meta name="theme-color" content="#0b1020" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Scrims.ff" />
    <meta property="og:title" content="Scrims.ff — Free Fire Tournaments" />

      property="og:description"
      content="Full Map and Clash Squad Free Fire tournaments with instant slot booking and coin prizes."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Scrims.ff" />
    <script>
      // Block pinch-zoom (Safari ignores user-scalable=no) and ctrl+wheel zoom
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (event) {
        document.addEventListener(event, function (e) { e.preventDefault(); }, { passive: false });
      });
      document.addEventListener('touchmove', function (e) {
        if (e.touches && e.touches.length > 1) e.preventDefault();
      }, { passive: false });
      document.addEventListener('wheel', function (e) {
        if (e.ctrlKey) e.preventDefault();
      }, { passive: false });
      document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault();
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
